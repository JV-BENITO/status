name: Fix base path

on:
  push:
    branches:
      - gh-pages

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Patch base path in index.html
        run: |
          if grep -q '<base href=/ >' index.html; then
            sed -i \
              -e 's|<base href=/ >|<base href=/status/ >|g' \
              -e 's|baseUrl:""|baseUrl:"/status"|g' \
              -e "s|register('/service-worker.js')|register('/status/service-worker.js')|g" \
              -e 's|/client/|/status/client/|g' \
              -e 's|href=/logo-192\.png|href=/status/logo-192.png|g' \
              index.html
          fi

      - name: Commit patch
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "fix: correct base path for /status/ subpath [skip ci]"
          git pushime-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "fix: correct base path for /status/ subpath [skip ci]"
          git push
